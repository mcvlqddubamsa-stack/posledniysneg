#snow{position:fixed;inset:0;width:100%;height:100%;z-index:4;pointer-events:none}
.fog{position:fixed;inset:0;z-index:2;pointer-events:none;background:linear-gradient(110deg,rgba(190,204,212,.05),transparent 45%,rgba(208,219,225,.07));animation:fog 17s ease-in-out infinite alternate}
.grain{position:fixed;inset:0;z-index:5;pointer-events:none;opacity:.11;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 160 160' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.6'/%3E%3C/svg%3E");mix-blend-mode:screen}
.vignette{position:fixed;inset:0;z-index:3;pointer-events:none;background:radial-gradient(ellipse at 52% 48%,transparent 20%,rgba(0,0,0,.35) 70%,rgba(0,0,0,.85) 120%)}
.layout{position:relative;z-index:6;width:100%;height:100%;padding:clamp(22px,5vw,76px);display:flex;align-items:center}
.left-panel{width:min(440px,44vw);padding:0 0 2vh 2vw;position:relative;animation:fadeUp 1.6s ease both}
.topline{font:10px Arial,sans-serif;letter-spacing:.42em;color:#aeb8bd;margin-bottom:25px;text-transform:uppercase}
h1{font-weight:normal;font-size:clamp(32px,4.6vw,68px);line-height:.94;letter-spacing:.035em;margin:0 0 18px;text-shadow:0 2px 4px #000,0 0 24px rgba(216,230,238,.16);white-space:nowrap}
.tagline{font-size:clamp(13px,1.45vw,17px);font-style:italic;letter-spacing:.03em;color:#c4cbd0;margin:0 0 clamp(30px,6vh,60px);text-shadow:0 2px 4px #000}
nav{display:flex;flex-direction:column;align-items:flex-start;gap:9px}
.menu-btn{position:relative;border:0;background:none;color:#c9d0d4;font:clamp(14px,1.3vw,17px) Georgia,serif;letter-spacing:.2em;text-align:left;padding:11px 0 11px 18px;cursor:pointer;min-width:260px;transition:color .3s,text-shadow .35s,transform .35s;outline:none}
.menu-btn:before{content:"";position:absolute;left:0;top:50%;width:6px;height:6px;border:1px solid rgba(220,231,237,.38);transform:translateY(-50%) rotate(45deg);transition:.35s}
.menu-btn:after{content:"";position:absolute;left:18px;right:100%;bottom:5px;height:1px;background:linear-gradient(90deg,rgba(234,242,246,.75),transparent);transition:right .4s}
.menu-btn:hover,.menu-btn:focus-visible{color:#fff;text-shadow:0 0 15px rgba(230,240,246,.8),0 0 30px rgba(198,218,230,.35);transform:translateX(5px)}
.menu-btn:hover:before{background:#e8eef1;box-shadow:0 0 12px #e8eef1}
.menu-btn:hover:after{right:25%}
.audio{margin-top:clamp(28px,5vh,48px);width:min(310px,100%);padding-top:16px;border-top:1px solid rgba(209,222,229,.2);display:flex;align-items:center;gap:13px}
.audio-btn{border:1px solid rgba(207,222,230,.3);background:rgba(9,13,16,.28);color:#cbd4d9;padding:10px 12px;font:9px Arial,sans-serif;letter-spacing:.14em;cursor:pointer;transition:.3s;white-space:nowrap}
.audio-btn:hover,.audio-btn[aria-pressed=true]{border-color:rgba(234,242,246,.75);color:#fff;text-shadow:0 0 10px #dce8ef;box-shadow:0 0 18px rgba(209,229,239,.1)}

.footer{position:fixed;z-index:7;left:clamp(24px,5vw,76px);right:clamp(24px,5vw,76px);bottom:clamp(16px,3vh,30px);display:flex;justify-content:space-between;color:rgba(204,215,221,.5);font:9px Arial,sans-serif;letter-spacing:.2em}
.dialog{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(3,5,7,.76);backdrop-filter:blur(7px)}
.dialog.open{display:flex;animation:fade .25s}
.dialog-box{max-width:420px;width:100%;padding:30px 26px;text-align:center;background:rgba(13,16,19,.97);border:1px solid rgba(206,222,231,.28);box-shadow:0 20px 80px #000}
.dialog-box h2{font-size:20px;font-weight:normal;letter-spacing:.12em;margin:0 0 14px}.dialog-box p{font-size:14px;line-height:1.65;color:#b8c3ca;margin:0 0 23px}
.dialog-box button{border:1px solid rgba(205,221,230,.35);background:transparent;color:#e0e8ed;padding:11px 26px;font:10px Arial,sans-serif;letter-spacing:.2em;cursor:pointer}
.dialog-box button:hover{background:rgba(210,229,239,.1)}
@keyframes slowZoom{from{transform:scale(1.025)}to{transform:scale(1.09)}}
@keyframes fog{from{transform:translateX(-3%);opacity:.45}to{transform:translateX(3%);opacity:.9}}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
@keyframes heroIn{from{opacity:0;transform:translateX(22px)}to{opacity:.84;transform:translateX(0)}}
@keyframes fade{from{opacity:0}to{opacity:1}}

/* Landscape-first composition and safe-area handling */
.layout{position:fixed;inset:0;display:flex;align-items:center;padding:clamp(24px,5vh,60px) clamp(28px,6vw,90px);z-index:5}
.left-panel{width:min(440px,44vw);padding:0;}

<div class="audio"><button class="audio-btn" id="musicToggle" aria-pressed="false">♫ ЗВУК: ВЫКЛ</button></div>
</section></main>
<div class="orientation-hint" aria-hidden="true"><div><span>▱ ↻</span>ПОВЕРНИТЕ УСТРОЙСТВО<br>В ГОРИЗОНТАЛЬНОЕ ПОЛОЖЕНИЕ</div></div>
<footer class="footer"><span>ЗИМНЯЯ ДЕРЕВНЯ</span><span>МЕНЮ · DEMO 0.2</span></footer>
<div class="dialog" id="dialog" role="dialog" aria-modal="true" aria-labelledby="dialogTitle"><div class="dialog-box"><h2 id="dialogTitle">ПОСЛЕДНИЙ СНЕГ</h2><p id="dialogText"></p><button id="dialogClose">ЗАКРЫТЬ</button></div></div>
<script>
(()=>{'use strict';
const c=document.getElementById('snow'),x=c.getContext('2d');let w,h,dpr,flakes=[],t=0;
function size(){dpr=Math.min(devicePixelRatio||1,2);w=innerWidth;h=innerHeight;c.width=w*dpr;c.height=h*dpr;c.style.width=w+'px';c.style.height=h+'px';x.setTransform(dpr,0,0,dpr,0,0);flakes=Array.from({length:Math.min(180,Math.floor(w*h/4800))},()=>({x:Math.random()*w,y:Math.random()*h,r:.45+Math.random()*2.1,v:.35+Math.random()*1.5,a:.2+Math.random()*.68,phase:Math.random()*6}))}
addEventListener('resize',size);size();
function snow(){t+=.01;x.clearRect(0,0,w,h);x.fillStyle='#e9eff2';for(const f of flakes){f.y+=f.v;f.x+=Math.sin(t+f.phase)*.35+.18;if(f.y>h+4){f.y=-4;f.x=Math.random()*w}if(f.x>w+3)f.x=-3;x.globalAlpha=f.a;x.beginPath();x.arc(f.x,f.y,f.r,0,Math.PI*2);x.fill()}x.globalAlpha=1;requestAnimationFrame(snow)}snow();
// Original procedural ambient score: sub-bass drone, shifting wind/noise and sparse piano-like tones.
let ac=null,master=null,active=false,noteTimer=null,step=0,windMod=null;const toggle=document.getElementById('musicToggle');
function buildSound(){const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return false;ac=new AC();master=ac.createGain();master.gain.value=0;master.connect(ac.destination);
// Slow-moving low drone
const bass=ac.createOscillator(),bassGain=ac.createGain(),bassFilter=ac.createBiquadFilter();bass.type='sine';bass.frequency.value=36.7;bassFilter.type='lowpass';bassFilter.frequency.value=100;bassGain.gain.value=.7;bass.connect(bassFilter);bassFilter.connect(bassGain);bassGain.connect(master);bass.start();
[55,73.42,110].forEach((f,i)=>{const o=ac.createOscillator(),g=ac.createGain();o.type=i===1?'triangle':'sine';o.frequency.value=f;o.detune.value=i===2?-17:7;g.gain.value=.06/(i+1);o.connect(g);g.connect(master);o.start()});
// Wind noise with slowly wandering filter
const buf=ac.createBuffer(1,ac.sampleRate*5,ac.sampleRate),data=buf.getChannelData(0);for(let i=0;i<data.length;i++)data[i]=(Math.random()*2-1)*.45;const noise=ac.createBufferSource();noise.buffer=buf;noise.loop=true;const filter=ac.createBiquadFilter(),wind=ac.createGain();filter.type='lowpass';filter.frequency.value=260;wind.gain.value=.17;noise.connect(filter);filter.connect(wind);wind.connect(master);noise.start();
windMod=ac.createOscillator();const modGain=ac.createGain();windMod.type='sine';windMod.frequency.value=.075;modGain.gain.value=150;windMod.connect(modGain);modGain.connect(filter.frequency);windMod.start();
return true}
const pitches=[146.83,138.59,110,98,123.47,92.5,110,82.41,164.81,98];
function note(){if(!active||!ac)return;const now=ac.currentTime,f=pitches[step++%pitches.length],o=ac.createOscillator(),g=ac.createGain(),filter=ac.createBiquadFilter();o.type='triangle';o.frequency.setValueAtTime(f,now);o.frequency.exponentialRampToValueAtTime(f*.985,now+3.5);filter.type='lowpass';filter.frequency.value=480;g.gain.setValueAtTime(.0001,now);g.gain.linearRampToValueAtTime(.08,now+.18);g.gain.exponentialRampToValueAtTime(.0001,now+5);o.connect(filter);filter.connect(g);g.connect(master);o.start(now);o.stop(now+5.1);noteTimer=setTimeout(note,3600+Math.random()*2800)}
async function soundToggle(){if(!active){if(!ac&&!buildSound()){show('ЗВУК НЕДОСТУПЕН','Этот браузер не поддерживает генерацию звука.');return}await ac.resume();active=true;toggle.textContent='♫ ЗВУК: ВКЛ';toggle.setAttribute('aria-pressed','true');master.gain.setTargetAtTime(.26,ac.currentTime,.65);note()}else{active=false;toggle.textContent='♫ ЗВУК: ВЫКЛ';toggle.setAttribute('aria-pressed','false');clearTimeout(noteTimer);master.gain.setTargetAtTime(0,ac.currentTime,.6)}}
toggle.addEventListener('click',soundToggle);
// Begin audio on the first meaningful interaction, with the button remaining the mute toggle.
let firstInteraction=false;function startOnInteraction(){if(firstInteraction)return;firstInteraction=true;if(!active)soundToggle()}
document.querySelectorAll('.menu-btn').forEach(b=>b.addEventListener('click',startOnInteraction,{once:false}));document.addEventListener('pointerdown',startOnInteraction,{once:true});document.addEventListener('keydown',startOnInteraction,{once:true});
const dlg=document.getElementById('dialog'),title=document.getElementById('dialogTitle'),text=document.getElementById('dialogText');
function show(a,b){title.textContent=a;text.textContent=b;dlg.classList.add('open');document.getElementById('dialogClose').focus()}function close(){dlg.classList.remove('open')}
document.getElementById('dialogClose').addEventListener('click',close);dlg.addEventListener('click',e=>{if(e.target===dlg)close()});addEventListener('keydown',e=>{if(e.key==='Escape')close()});
document.querySelectorAll('.menu-btn').forEach(b=>b.addEventListener('click',()=>{switch(b.dataset.action){case'play':show('ИГРА В РАЗРАБОТКЕ','История ещё создаётся. Сейчас доступно только атмосферное главное меню.');break;case'continue':show('НЕТ СОХРАНЕНИЙ','Здесь пока нет ни одного сохранения.');break;case'settings':show('НАСТРОЙКИ','Фоновая музыка включается автоматически после первого взаимодействия. Её можно выключить кнопкой звука.');break;case'exit':show('ВЫХОД','Чтобы покинуть меню, закрой вкладку браузера.');break}}));
})();
</script></body></html>
